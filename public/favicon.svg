<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f4c81"/>
      <stop offset="100%" stop-color="#060b17"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="24" fill="url(#oceanGrad)"/>
  <rect x="3" y="3" width="94" height="94" rx="21" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  
  <!-- Optical Reticle / Microscopic Lens Rings -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" stroke-dasharray="3, 3"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5"/>

  <!-- Stylized Centric / Chain Plankton Microorganism -->
  <circle cx="50" cy="50" r="14" fill="#0f4c81" stroke="url(#neonGlow)" stroke-width="3"/>
  <circle cx="50" cy="50" r="6" fill="#38bdf8"/>

  <!-- Plankton Setae / Flagella Radiations -->
  <line x1="50" y1="16" x2="50" y2="28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="72" x2="50" y2="84" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="50" x2="28" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="50" x2="84" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <line x1="26" y1="26" x2="35" y2="35" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="26" x2="65" y2="35" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="74" x2="35" y2="65" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="74" x2="65" y2="65" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
</svg>
